---
- hosts: all
  user: ec2-user
  become: True
  tasks:
    - name: install docker
      yum:
        name: docker
        state: latest

    - name: start docker service
      service:
        name: docker
        state: started

    - name: add ec2-user to docker group
      user:
        name: ec2-user
        append: yes
        groups: docker

    - name: copy runit rpm to target
      copy:
        src: files/runit-2.1.2-1.amzn1.x86_64.rpm
        dest: /tmp/runit.rpm

    - name: install packages
      yum:
        name: "{{ item }}"
        state: present
      with_items:
        - /tmp/runit.rpm
        - nginx

    - name: start nginx
      service:
        name: nginx
        state: started
        enabled: yes
