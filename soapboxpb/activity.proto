syntax = "proto3";
package soapbox;
option go_package = "proto";

import "soapbox.proto";

service Activities {
    rpc AddActivity (Activity) returns (soapbox.Empty) {}
}

enum ActivityType {
    APPLICATION_CREATED = 0;
    DEPLOYMENT_STARTED = 1;
    DEPLOYMENT_SUCCESS = 2;
    DEPLOYMENT_FAILURE = 3;
    ENVIRONMENT_CREATED = 4;
}

message Activity {
    ActivityType type = 1;
    int32 user_id = 2;
    int32 application_id = 3;
    int32 deployment_id = 4;
    int32 environment_id = 5;
    int32 configuration_id = 6;
}