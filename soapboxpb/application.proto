syntax = "proto3";
package soapbox;
option go_package = "soapboxpb";

service Applications {
    rpc ListApplications (Empty) returns (ListApplicationResponse) {}
    rpc CreateApplication (Application) returns (Application) {}
    rpc GetApplication (GetApplicationRequest) returns (Application) {}
}

message Empty {};

enum ApplicationType {
    SERVER = 0;
    CRONJOB = 1;
}

message Application {
    int32 id = 1;
    string name = 2;
    string description = 3;
    string externalDNS = 4;
    string githubRepoURL = 5;
    string dockerfilePath = 6;
    string entrypointOverride = 7;
    ApplicationType type = 8;
    string createdAt = 9;
}

message ListApplicationResponse {
    repeated Application applications = 1;
}

message GetApplicationRequest {
    int32 id = 1;
}
