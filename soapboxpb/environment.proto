syntax = "proto3";
package soapbox;
option go_package = "soapboxpb";

import "soapbox.proto";

service Environments {
    rpc ListEnvironments (soapbox.Empty) returns (ListEnvironmentResponse) {}
    rpc GetEnvironment (GetEnvironmentRequest) returns (Environment) {}
    rpc CreateEnvironment (Environment) returns (Environment) {}
    rpc DestroyEnvironment (DestroyEnvironmentRequest) returns (soapbox.Empty) {}
    rpc CopyEnvironment (CopyEnvironmentRequest) returns (Environment) {}
}

message ListEnvironmentResponse {
    repeated Environment environments = 1;
}

message GetEnvironmentRequest {
    int32 id = 1;
}

message Environment {
    int32 id = 1;
    string name = 2;
    string slug = 3;
    repeated EnvironmentVariable vars = 4;
    string createdAt = 5;
}

message EnvironmentVariable {
    int32 id = 1;
    string key = 2;
    string value = 3;
}

message DestroyEnvironmentRequest {
    int32 id = 1;
}

message CopyEnvironmentRequest {
    int32 id = 1;
}
